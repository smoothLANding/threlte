<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>welcome to a low quality life</title>
    <meta name="description" content="welcome to a low quality life" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="welcome to a low quality life" />
    <meta property="og:description" content="lowquality.life" />
    <meta property="og:image" content="https://lowquality.life/photo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:," />
    <link rel="preload" as="image" href="/photo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap"
    />
    <style>
      :root {
        --ink: #f3efe7;
        --stagger: 42ms;
        --rise: 1100ms;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: var(--ink);
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }

      /* ---------- title ---------- */

      .title {
        margin: 0;
        padding: 0 6vw;
        max-width: 22ch;
        text-align: center;
        text-wrap: balance;
        font-style: italic;
        font-weight: 300;
        font-size: clamp(2.2rem, 7vw, 5.6rem);
        line-height: 1.12;
        letter-spacing: 0.015em;
        transition:
          opacity 1000ms cubic-bezier(0.4, 0, 0.2, 1),
          filter 1000ms cubic-bezier(0.4, 0, 0.2, 1),
          transform 1000ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .title.out {
        opacity: 0;
        filter: blur(14px);
        transform: scale(1.05);
      }

      .word {
        display: inline-block;
        white-space: nowrap;
      }

      .ch {
        display: inline-block;
        opacity: 0;
        filter: blur(12px);
        transform: translateY(0.45em);
        color: transparent;
        background: linear-gradient(
          105deg,
          var(--ink) 0%,
          var(--ink) 38%,
          #ffffff 50%,
          var(--ink) 62%,
          var(--ink) 100%
        );
        background-size: 320% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        background-clip: text;
        animation:
          rise var(--rise) cubic-bezier(0.2, 0.75, 0.2, 1) forwards,
          sweep 1400ms cubic-bezier(0.45, 0, 0.25, 1) forwards;
        animation-delay:
          calc(var(--i) * var(--stagger)),
          calc(2100ms + var(--i) * 28ms);
      }

      @keyframes rise {
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }

      @keyframes sweep {
        to {
          background-position: 0% 0;
        }
      }

      /* ---------- photo ---------- */

      .photo {
        position: fixed;
        inset: 0;
        margin: 0;
        display: grid;
        place-items: center;
        opacity: 0;
        transform: scale(1.045);
        pointer-events: none;
        transition:
          opacity 1600ms cubic-bezier(0.25, 0.1, 0.25, 1),
          transform 2600ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .photo.in {
        opacity: 1;
        transform: scale(1);
      }

      .photo img {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100dvh;
        width: auto;
        height: auto;
        object-fit: contain;
      }

      .photo canvas {
        position: absolute;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        transition: opacity 700ms ease-out;
      }

      .photo canvas.gone {
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .ch {
          animation-duration: 600ms, 1ms;
          animation-delay: 0ms, 0ms;
        }
        .title {
          transition-duration: 500ms;
        }
        .photo {
          transition-duration: 700ms, 700ms;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <h1 class="title" id="title">welcome to a low quality life</h1>
    </main>

    <figure class="photo" id="photo">
      <img id="img" src="/photo.jpg" alt="welcome to a low quality life" decoding="async" />
      <canvas id="pixels" aria-hidden="true"></canvas>
    </figure>

    <script>
      (() => {
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const title = document.getElementById('title');
        const photo = document.getElementById('photo');
        const img = document.getElementById('img');
        const canvas = document.getElementById('pixels');

        const wait = (ms) => new Promise((r) => setTimeout(r, ms));

        // Split the headline into per-letter spans so each glyph can animate on its own.
        const text = title.textContent;
        title.textContent = '';
        let i = 0;
        for (const word of text.split(' ')) {
          const w = document.createElement('span');
          w.className = 'word';
          for (const letter of word) {
            const c = document.createElement('span');
            c.className = 'ch';
            c.style.setProperty('--i', i++);
            c.textContent = letter;
            w.appendChild(c);
          }
          title.appendChild(w);
          title.appendChild(document.createTextNode(' '));
        }

        const letterCount = i;
        const stagger = reduce ? 0 : 42;
        const rise = reduce ? 600 : 1100;
        // Hold long enough for the light sweep on the last letter to finish.
        const titleDone = letterCount * stagger + rise + (reduce ? 400 : 2200);

        let skipped = false;
        let resolveSkip;
        const skip = new Promise((r) => (resolveSkip = r));
        const onSkip = () => {
          skipped = true;
          resolveSkip();
        };
        addEventListener('pointerdown', onSkip, { once: true });
        addEventListener('keydown', onSkip, { once: true });

        const race = (ms) => Promise.race([wait(ms), skip]);

        // Progressive "low quality -> full quality" reveal: paint the photo at a coarse
        // resolution and refine it toward the real image, then hand off to the <img>.
        function pixelReveal(duration) {
          // Layout offsets ignore the parent's in-flight scale transform.
          const { offsetLeft: x, offsetTop: y, offsetWidth: w, offsetHeight: h } = img;
          const dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.style.left = x + 'px';
          canvas.style.top = y + 'px';
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);

          const ctx = canvas.getContext('2d');
          const scratch = document.createElement('canvas');
          const sctx = scratch.getContext('2d');
          if (!ctx || !sctx) return Promise.resolve();

          const minCols = 6;
          const maxCols = canvas.width;
          const start = performance.now();

          return new Promise((done) => {
            function frame(now) {
              const t = Math.min(1, (now - start) / duration);
              const eased = 1 - Math.pow(1 - t, 3);
              // Exponential ramp keeps the early frames chunky and the late frames near-final.
              const cols = Math.max(minCols, Math.round(minCols * Math.pow(maxCols / minCols, eased)));
              const rows = Math.max(1, Math.round(cols * (canvas.height / canvas.width)));

              scratch.width = cols;
              scratch.height = rows;
              sctx.imageSmoothingEnabled = true;
              sctx.drawImage(img, 0, 0, cols, rows);

              ctx.imageSmoothingEnabled = false;
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(scratch, 0, 0, canvas.width, canvas.height);

              if (t < 1 && !skipped) requestAnimationFrame(frame);
              else done();
            }
            requestAnimationFrame(frame);
          });
        }

        async function run() {
          const ready = img.decode().catch(() => {});

          await race(titleDone);
          title.classList.add('out');
          await Promise.all([race(reduce ? 350 : 700), ready]);

          photo.classList.add('in');
          if (!reduce && !skipped && img.naturalWidth) {
            await pixelReveal(2000);
          }
          canvas.classList.add('gone');
          await wait(800);
          canvas.remove();
          title.remove();
        }

        run();
      })();
    </script>
  </body>
</html>
